<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생명체와 엔트로피 시뮬레이션</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#172033;--muted:#9aa9bd;--text:#e5edf8;--green:#34d399;--orange:#fb923c;--blue:#60a5fa;--purple:#a78bfa;--border:#334155}
*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:radial-gradient(circle at top,#243858,#0f172a 58%);color:var(--text);font:16px system-ui,"Noto Sans KR",sans-serif}.app{max-width:1000px;margin:auto}h1{margin:.25rem 0 .5rem;font-size:clamp(1.5rem,4vw,2.2rem)}p{color:var(--muted);line-height:1.6}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.time{color:var(--muted);font-variant-numeric:tabular-nums}.controls,.panel,.stat,.note{background:rgba(23,32,51,.86);border:1px solid var(--border);border-radius:14px}.controls{display:flex;gap:16px;align-items:end;flex-wrap:wrap;padding:14px;margin-bottom:18px}.field{min-width:210px;flex:1}.field label,.metric-head{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:6px}.field output{color:var(--text)}input{width:100%;accent-color:var(--blue)}button{padding:10px 14px;border-radius:9px;border:1px solid var(--border);font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#08111f}.secondary{background:var(--panel);color:var(--text)}button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:16px}.panel h2{font-size:1rem;margin:0 0 12px}.scene{height:250px;position:relative;overflow:hidden;border-radius:10px;background:#1e293b;border:1px solid var(--border)}.life{border-color:var(--green)}.env{border-color:var(--orange)}.organism{position:absolute;inset:50px 25%;border:2px solid var(--green);border-radius:24px;transition:transform .2s}.organism i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--green);transform:translate(-50%,-50%)}.organism i:nth-child(1){left:20%;top:25%}.organism i:nth-child(2){left:50%;top:25%}.organism i:nth-child(3){left:80%;top:25%}.organism i:nth-child(4){left:20%;top:50%}.organism i:nth-child(5){left:50%;top:50%}.organism i:nth-child(6){left:80%;top:50%}.organism i:nth-child(7){left:20%;top:75%}.organism i:nth-child(8){left:50%;top:75%}.organism i:nth-child(9){left:80%;top:75%}.caption{position:absolute;inset:46% 0 auto;text-align:center;color:var(--green);font-weight:700}.env .caption{color:var(--orange)}.particle{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--orange);opacity:.8}.particle:nth-child(1){left:8%;top:18%}.particle:nth-child(2){left:25%;top:73%}.particle:nth-child(3){left:44%;top:25%}.particle:nth-child(4){left:62%;top:67%}.particle:nth-child(5){left:82%;top:36%}.particle:nth-child(6){left:15%;top:47%}.particle:nth-child(7){left:37%;top:88%}.particle:nth-child(8){left:55%;top:10%}.particle:nth-child(9){left:76%;top:83%}.particle:nth-child(10){left:91%;top:61%}.particle:nth-child(11){left:6%;top:90%}.particle:nth-child(12){left:51%;top:52%}.metric{margin-top:11px}.track{height:10px;background:#0f172a;border-radius:99px;overflow:hidden}.bar{height:100%;transition:width .2s}.green{background:var(--green)}.orange{background:var(--orange)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{padding:14px}.label{color:var(--muted);font-size:.8rem}.value{font-size:1.3rem;margin-top:4px;font-variant-numeric:tabular-nums}.note{padding:12px 14px;margin-top:14px;border-left:3px solid var(--green);line-height:1.5}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}.field{min-width:100%}}
</style>
</head>
<body>
<main class="app">
<div class="head"><div><h1>생명체와 엔트로피</h1><p>생명체는 에너지를 사용해 내부의 질서를 유지하고, 열과 노폐물로 엔트로피를 방출합니다. 주변은 무한한 공간으로 가정하여 방출된 엔트로피가 계속 퍼집니다.</p></div><div class="time" id="time">시간 0</div></div>
<section class="controls" aria-label="시뮬레이션 조절"><div class="field"><label for="energy">에너지 유입 <output id="energyOut">60</output></label><input id="energy" type="range" min="10" max="100" value="60"></div><div class="field"><label for="metabolism">대사 속도 <output id="metabolismOut">55</output></label><input id="metabolism" type="range" min="10" max="100" value="55"></div><div class="field"><label for="hormone">호르몬 신호 <output id="hormoneOut">50</output></label><input id="hormone" type="range" min="0" max="100" value="50"></div><div class="field"><label for="environment">주변 엔트로피 <output id="environmentOut">50</output></label><input id="environment" type="range" min="0" max="100" value="50"></div><button id="run" class="primary" type="button">▶ 시작</button><button id="reset" class="secondary" type="button">↺ 초기화</button></section>
<div class="grid">
<section class="panel"><h2>생명체 내부: 낮은 엔트로피 상태</h2><div class="scene life"><div class="organism" id="organism"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="caption">낮은 엔트로피</div></div><div class="metric"><div class="metric-head"><span>생명체 내부 엔트로피</span><strong id="entropyText">50%</strong></div><div class="track"><div id="entropyBar" class="bar green" style="width:50%"></div></div></div></section>
<section class="panel"><h2>주변 환경: 흩어진 열·노폐물</h2><div class="scene env"><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i><div class="caption">높아지는 엔트로피</div></div><div class="metric"><div class="metric-head"><span>주변 엔트로피</span><strong id="envText">50%</strong></div><div class="track"><div id="envBar" class="bar orange" style="width:50%"></div></div></div></section>
</div>
<div class="summary"><div class="stat"><div class="label">생명체 내부 엔트로피 S</div><div class="value" id="lifeS">50.0</div></div><div class="stat"><div class="label">주변 엔트로피 S</div><div class="value" id="envS">50.0</div></div><div class="stat"><div class="label">전체 ΔS</div><div class="value" id="totalS">+0.0</div></div></div>
<div class="note" id="note" aria-live="polite">시작을 누르면 생명체 내부 엔트로피와 전체 ΔS가 변합니다. 주변 엔트로피는 슬라이더로 직접 조절합니다.</div>
</main>
<script>
(function(){var e=document.getElementById("energy"),m=document.getElementById("metabolism"),h=document.getElementById("hormone"),a=document.getElementById("environment"),run=document.getElementById("run"),reset=document.getElementById("reset"),life=50,env=50,total=0,t=0,timer=null;function put(id,v){document.getElementById(id).textContent=v}function controls(){var en=+e.value,me=+m.value,ho=+h.value,environment=+a.value,effective=me+(ho-50)*.5,target=Math.max(0,Math.min(100,50-(en-effective)*.7)),leak=en*.012+Math.max(0,effective)*.008+Math.abs(ho-50)*.002;return {en:en,me:me,ho:ho,environment:environment,effective:effective,target:target,leak:leak}}function render(){var c=controls(),internalEntropy=life;env=c.environment;put("energyOut",c.en);put("metabolismOut",c.me);put("hormoneOut",c.ho);put("environmentOut",c.environment);put("lifeS",internalEntropy.toFixed(1));put("envS",env.toFixed(1));put("totalS","+"+total.toFixed(1));put("entropyText",internalEntropy.toFixed(1)+"%");put("envText",Math.round(env)+"%");put("time","시간 "+t);document.getElementById("entropyBar").style.width=internalEntropy+"%";document.getElementById("envBar").style.width=env+"%";document.getElementById("organism").style.transform="scale("+(1.18-internalEntropy/500)+")";put("note",c.ho>65?"호르몬 신호가 높아 대사와 에너지 사용이 활발해지고, 열 방출도 커집니다.":c.ho<35?"호르몬 신호가 낮아 대사 활동과 질서 유지가 느려집니다.":c.en>=c.effective?"에너지와 호르몬 신호가 내부 엔트로피를 낮추는 방향으로 작용합니다.":"에너지 유입보다 조절된 대사 요구가 커서 내부 엔트로피가 증가하는 방향으로 작용합니다.")}function step(){var c=controls();life=Math.max(0,Math.min(100,life+(c.target-life)*.18+(c.effective-c.en)*.003));total+=c.leak*.11;t++;render()}function nudge(){var c=controls();life=Math.max(0,Math.min(100,life+(c.target-life)*.35));render()}e.addEventListener("input",nudge);m.addEventListener("input",nudge);h.addEventListener("input",nudge);a.addEventListener("input",render);run.addEventListener("click",function(){if(timer){clearInterval(timer);timer=null;put("run","▶ 시작")}else{timer=setInterval(step,180);put("run","❚❚ 일시정지")}});reset.addEventListener("click",function(){if(timer){clearInterval(timer);timer=null}life=50;env=50;total=0;t=0;put("run","▶ 시작");render()});render()}());
</script>
</body>
</html>
